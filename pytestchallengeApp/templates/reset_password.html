<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Password Reset
    </title>
</head>

<body>

    {% if token_valid %}

        <h1>
            Choose a new password
        </h1>

        <p>
            Enter and confirm your new password.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change password
            </button>

        </form>

    {% else %}

        <h1>
            Reset link invalid or expired
        </h1>

        <p>
            This password reset link is invalid
            or expired.
        </p>

        <a href="{% url 'password-reset-request' %}">
            Request another reset link
        </a>

    {% endif %}

</body>

</html>
