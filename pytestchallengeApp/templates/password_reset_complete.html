<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Password Changed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-sky-100 text-center">
        <h1 class="text-2xl font-bold text-slate-800">
            Password changed successfully
        </h1>
        
        <p class="text-sm text-slate-500 mt-2 mb-6">
            Your password has been changed.
        </p>

        <a 
            href="{% url 'login' %}" 
            class="inline-block w-full py-2.5 px-4 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-lg shadow-sm transition-colors duration-200 text-center focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2"
        >
            Back to login
        </a>

    </div>
</body>
</html>
